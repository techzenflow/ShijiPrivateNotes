name: Android APK and Tests

on:
  workflow_dispatch:

concurrency:
  group: shiji-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Unit tests and Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION_NAME" == *-beta.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION_NAME" || { echo "Tag/version mismatch"; exit 1; }
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Prepare persistent release signing key
        shell: bash
        env:
          SHIJI_KEYSTORE_BASE64: ${{ secrets.SHIJI_KEYSTORE_BASE64 }}
          SHIJI_KEYSTORE_PASSWORD: ${{ secrets.SHIJI_KEYSTORE_PASSWORD }}
          SHIJI_KEY_ALIAS: ${{ secrets.SHIJI_KEY_ALIAS }}
          SHIJI_KEY_PASSWORD: ${{ secrets.SHIJI_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in SHIJI_KEYSTORE_BASE64 SHIJI_KEYSTORE_PASSWORD SHIJI_KEY_ALIAS SHIJI_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done
          echo "$SHIJI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shiji-release.jks"
          test -s "$RUNNER_TEMP/shiji-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/shiji-release.jks" -storepass "$SHIJI_KEYSTORE_PASSWORD" -alias "$SHIJI_KEY_ALIAS" >/dev/null
          echo "SHIJI_KEYSTORE_PATH=$RUNNER_TEMP/shiji-release.jks" >> "$GITHUB_ENV"
          echo "SHIJI_KEYSTORE_PASSWORD=$SHIJI_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SHIJI_KEY_ALIAS=$SHIJI_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SHIJI_KEY_PASSWORD=$SHIJI_KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.shiji.notes'"
      - name: Name APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          APK="dist/ShijiPrivateNotes-$VERSION-Android-universal.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          (cd dist && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          echo "SHA_FILE=$APK.sha256" >> "$GITHUB_ENV"
      - name: Generate release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          mkdir -p dist
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { found=1; print; next } found && /^## / { exit } found { print }' CHANGELOG.md > dist/release-notes.md
          test -s dist/release-notes.md || { echo "No changelog entry found for $VERSION"; exit 1; }
          printf '\n## 安装包与验证\n- 安装包：Android Universal APK。\n- 校验：同一 Release 附带 SHA-256 校验文件。\n- 自动检查：单元测试、Release APK 构建、签名与包名验证。\n- 设备说明：自动构建不等同于真机指纹识别、安装升级和数据迁移实测；请勿在备份前卸载旧版。\n' >> dist/release-notes.md
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-${{ steps.version.outputs.name }}-Android-universal
          path: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 14
      - name: Refresh existing release notes from changelog
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for VERSION in 1.0.1-beta.13 1.0.1-beta.14; do
            TAG="v$VERSION"
            NOTES="$RUNNER_TEMP/$TAG-notes.md"
            awk -v heading="## $VERSION" 'index($0, heading) == 1 { found=1; print; next } found && /^## / { exit } found { print }' CHANGELOG.md > "$NOTES"
            if [[ -s "$NOTES" ]] && gh release view "$TAG" >/dev/null 2>&1; then
              printf '\n## 安装包与验证\n- 自动检查：单元测试、Release APK 构建、签名与包名验证。\n- 真机指纹识别、安装升级和数据迁移仍需设备实测；请勿在备份前卸载旧版。\n' >> "$NOTES"
              gh release edit "$TAG" --notes-file "$NOTES"
            fi
          done
      - name: Publish versioned Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: 时迹私人笔记 v${{ steps.version.outputs.name }}
          body_path: dist/release-notes.md
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.latest }}
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
