name: Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Keep the same debug signing key between GitHub-hosted runners.
      # This is a beta/debug key only, not a production release key.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiji-debug-signing-key-v1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for mobile download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-Android-Test
          path: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-beta.1
          name: 时迹私人笔记 v1.0.1-beta.1
          body: |
            Android Beta 测试版。
            安装前请备份重要数据；此版本仍需进行设备兼容性和指纹功能实测。
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
