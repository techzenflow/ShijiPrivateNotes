name: Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Serialize all builds so the signing keystore cache cannot be initialized
# by competing runners with different keys.
concurrency:
  group: shiji-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        run: |
          grep -F 'versionName = "1.0.1-beta.5"' app/build.gradle.kts
          grep -F 'versionCode = 6' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Stable beta signing key. Builds are serialized above.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiji-debug-signing-key-v1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.shiji.notes'"

      - name: Name APK and generate checksum
        run: |
          set -euo pipefail
          SOURCE="app/build/outputs/apk/debug/app-debug.apk"
          DIST="dist"
          mkdir -p "$DIST"
          APK="$DIST/ShijiPrivateNotes-1.0.1-beta.5-Android-universal.apk"
          cp "$SOURCE" "$APK"
          (cd "$DIST" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          echo "SHA_FILE=$APK.sha256" >> "$GITHUB_ENV"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-1.0.1-beta.5-Android-universal
          path: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-beta.5
          name: 时迹私人笔记 v1.0.1-beta.5
          body: |
            ## 本次更新
            - 统一发布文件命名：项目名-版本-平台-架构。
            - Android APK 文件名包含版本号、Android 平台和 universal 架构标识。
            - 同步发布 SHA-256 校验文件。
            - Android versionCode 升级至 6。

            ## 文件说明
            - `ShijiPrivateNotes-1.0.1-beta.5-Android-universal.apk`：Android 通用 APK。
            - 同名 `.sha256`：用于校验 APK 下载完整性。

            ## 测试说明
            - 本版本继续验证 APK 安装与升级兼容性；需真实设备测试。
            - Beta 使用普通 GitHub Release，不勾选 Pre-release。
          prerelease: false
          make_latest: true
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
