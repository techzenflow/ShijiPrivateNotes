name: Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK for mobile download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-Android-Test
          path: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-debug-latest
          name: 时迹私人笔记 - 安卓测试版
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
