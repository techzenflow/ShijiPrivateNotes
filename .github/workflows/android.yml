name: Android APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Serialize all builds so the debug keystore cache cannot be initialized
# by competing runners with different signing keys.
concurrency:
  group: shiji-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release version
        run: |
          grep -F 'versionName = "1.0.1-beta.4"' app/build.gradle.kts
          grep -F 'versionCode = 5' app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Stable beta signing key. Builds are serialized above so only one
      # runner can initialize this cache at a time.
      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiji-debug-signing-key-v1

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for mobile download
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-Android-Test
          path: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-beta.4
          name: 时迹私人笔记 v1.0.1-beta.4
          body: |
            ## 本次更新
            - 修复构建并发导致 Debug 签名密钥缓存竞争的风险，所有 Android 发布构建改为串行执行。
            - 增加 APK 签名验证步骤，签名验证通过后才上传。
            - Android 版本升级至 1.0.1-beta.4（versionCode 5）。

            ## 测试说明
            - 本版本用于验证安装/升级兼容性问题；仍需在真实设备安装测试。
            - 普通 Release 展示不代表已通过正式版验收。
            - 安装前请备份重要数据。
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/debug/ShijiPrivateNotes-Android-Test.apk
