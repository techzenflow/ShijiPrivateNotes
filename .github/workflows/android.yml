name: Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

concurrency:
  group: shiji-android-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION_NAME" == *-beta.* ]]; then
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION_NAME" || { echo "Tag/version mismatch: $TAG_VERSION != $VERSION_NAME"; exit 1; }
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: latest
          packages: platform-tools
          accept-android-sdk-licenses: false

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # Existing debug keystore cache is retained temporarily. A permanent
      # release keystore in GitHub Actions secrets is required before production.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: shiji-debug-signing-key-v1

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK signature and package metadata
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.shiji.notes'"

      - name: Name APK and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.name }}"
          DIST="dist"
          mkdir -p "$DIST"
          APK="$DIST/ShijiPrivateNotes-$VERSION-Android-universal.apk"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$APK"
          (cd "$DIST" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          echo "APK_FILE=$APK" >> "$GITHUB_ENV"
          echo "SHA_FILE=$APK.sha256" >> "$GITHUB_ENV"

      - name: Upload versioned APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShijiPrivateNotes-${{ steps.version.outputs.name }}-Android-universal
          path: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish versioned Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 时迹私人笔记 v${{ steps.version.outputs.name }}
          body: |
            ## 本次更新
            请查看仓库 CHANGELOG.md 与 docs/CHANGELOG_BETA.md / docs/CHANGELOG_STABLE.md。

            ## 文件说明
            - APK：Android universal 通用安装包。
            - SHA-256：下载完整性校验文件。

            ## 测试说明
            - 构建与 APK 签名验证通过不等于已完成真实设备安装、升级或功能验证。
            - 请以本版本测试记录及已知问题为准。
          prerelease: ${{ steps.version.outputs.prerelease }}
          make_latest: ${{ steps.version.outputs.latest }}
          files: |
            ${{ env.APK_FILE }}
            ${{ env.SHA_FILE }}
